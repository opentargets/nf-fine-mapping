name: Check Collector

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/collector/**"
      - "docs/**"
      - ".github/workflows/collector-check.yml"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "tools/collector/**"
      - "docs/**"
      - ".github/workflows/collector-check.yml"
      - "Makefile"

jobs:
  test:
    name: Collector tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/collector/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync collector dependencies
        working-directory: tools/collector
        run: uv sync --frozen --all-groups

      - name: Run collector tests
        working-directory: tools/collector
        run: uv run --frozen pytest -rxs

  lint:
    name: Collector lint and type checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/collector/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync collector dependencies
        working-directory: tools/collector
        run: uv sync --frozen --all-groups

      - name: Run Ruff checks
        working-directory: tools/collector
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run ty
        working-directory: tools/collector
        run: uv run --frozen ty check src

  docs:
    name: Build pipeline documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/collector/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Sphinx documentation
        working-directory: tools/collector
        run: |
          uv sync --frozen --all-groups
          uv run --frozen sphinx-build -W -b html ../../docs ../../docs/_build/html
